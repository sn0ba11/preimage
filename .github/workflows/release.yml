name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            binary: preimage
            archive: preimage-linux-x86_64.tar.gz
          - os: windows-latest
            name: windows-x86_64
            binary: preimage.exe
            archive: preimage-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release -p preimage
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir dist
          cp target/release/preimage dist/preimage
          cp README.md LICENSE-APACHE LICENSE-MIT dist/
          tar -C dist -czf "${{ matrix.archive }}" preimage README.md LICENSE-APACHE LICENSE-MIT
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/preimage.exe dist/preimage.exe
          Copy-Item README.md,LICENSE-APACHE,LICENSE-MIT dist/
          Compress-Archive -Path dist/preimage.exe,dist/README.md,dist/LICENSE-APACHE,dist/LICENSE-MIT -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Set-Content -Encoding ascii "${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*             --title "Preimage ${GITHUB_REF_NAME}"             --notes "Native x86-64 binaries for the patched Preimage build with NTLM lookup and CloudAP / Microsoft Online Hashcat mode 33700 cache support. Built from commit ${GITHUB_SHA}."
