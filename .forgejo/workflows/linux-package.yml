name: Build Linux Package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish build products to a Forgejo release
        required: false
        type: boolean
        default: true
      release_kind:
        description: Release kind (test, prerelease, release)
        required: false
        type: string
        default: prerelease

concurrency:
  group: linux-package-${{ forgejo.repository }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build-linux-package:
    runs-on: docker
    timeout-minutes: 120

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          workspace="${FORGEJO_WORKSPACE:?FORGEJO_WORKSPACE is not defined}"
          mkdir -p "$workspace"
          cd "$workspace"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          basic="$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          git -c "http.extraHeader=Authorization: Basic $basic" fetch --no-tags --depth 1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$FORGEJO_SHA"

      - name: Build Linux package
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/dist/linux-builder"
          rm -rf "$output"
          mkdir -p "$output"
          export LINUX_BUILD_OUTPUT="$output"

          entrypoint=""
          for candidate in             .forgejo/linux-build.sh             build/linux.sh             scripts/build-linux.sh             packaging/linux/build.sh
          do
            if [[ -f "$candidate" ]]; then
              entrypoint="$candidate"
              break
            fi
          done

          if [[ -z "$entrypoint" ]]; then
            echo "No Linux build entrypoint found. Add one of: .forgejo/linux-build.sh, build/linux.sh, scripts/build-linux.sh, packaging/linux/build.sh. The script must write build products to \$LINUX_BUILD_OUTPUT." >&2
            exit 1
          fi

          chmod +x "$entrypoint"
          echo "Build entrypoint: $entrypoint"
          "$entrypoint"

      - name: Verify and describe build products
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/dist/linux-builder"
          mapfile -t artifacts < <(find "$output" -maxdepth 1 -type f -printf '%f\n' | sort)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No Linux build products were produced under $output." >&2
            exit 1
          fi

          for name in "${artifacts[@]}"; do
            case "$name" in
              *.sha256|linux-builder-provenance.json) continue ;;
            esac
            if [[ ! -f "$output/$name.sha256" ]]; then
              (cd "$output" && sha256sum "$name" > "$name.sha256")
            fi
          done

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path("dist/linux-builder")
          items = []
          for p in sorted(out.iterdir()):
              if p.is_file():
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  items.append({"name": p.name, "size": p.stat().st_size, "sha256": h})
          prov = {
              "schema_version": 1,
              "repository": os.environ.get("FORGEJO_REPOSITORY"),
              "commit": os.environ.get("FORGEJO_SHA"),
              "ref": os.environ.get("FORGEJO_REF"),
              "run_id": os.environ.get("FORGEJO_RUN_ID"),
              "run_number": os.environ.get("FORGEJO_RUN_NUMBER"),
              "runner": os.uname().nodename,
              "artifacts": items,
          }
          (out / "linux-builder-provenance.json").write_text(json.dumps(prov, indent=2) + "\n")
          PY
          ls -lh "$output"

      - name: Publish Forgejo release
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          kind='${{ inputs.release_kind }}'
          case "$kind" in
            test|prerelease|release) ;;
            *) echo "Invalid release_kind '$kind'." >&2; exit 1 ;;
          esac

          short_sha="${FORGEJO_SHA:0:12}"
          if [[ "$FORGEJO_REF" == refs/tags/* ]]; then
            tag="$FORGEJO_REF_NAME"
          else
            tag="build-${FORGEJO_RUN_NUMBER}-${short_sha}"
          fi

          prerelease=true
          [[ "$kind" == release ]] && prerelease=false
          api="$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY"
          auth=(-H "Authorization: token $FORGEJO_TOKEN")

          status="$(curl -ksS -o /tmp/release.json -w '%{http_code}' "${auth[@]}" "$api/releases/tags/$tag")"
          body="$(jq -nc             --arg tag "$tag"             --arg commit "$FORGEJO_SHA"             --arg name "$FORGEJO_REPOSITORY Linux build $tag"             --arg run "$FORGEJO_RUN_ID"             --argjson prerelease "$prerelease"             '{tag_name:$tag,target_commitish:$commit,name:$name,body:("LinuxBuilder run " + $run + " for commit " + $commit + "."),draft:false,prerelease:$prerelease}')"

          if [[ "$status" == 404 ]]; then
            curl -kfsS "${auth[@]}" -H 'Content-Type: application/json' -d "$body" "$api/releases" > /tmp/release.json
          elif [[ "$status" == 200 ]]; then
            id="$(jq -r .id /tmp/release.json)"
            curl -kfsS "${auth[@]}" -X PATCH -H 'Content-Type: application/json' -d "$body" "$api/releases/$id" > /tmp/release.json
          else
            echo "Forgejo release lookup failed with HTTP $status" >&2
            exit 1
          fi

          id="$(jq -r .id /tmp/release.json)"
          for file in dist/linux-builder/*; do
            [[ -f "$file" ]] || continue
            name="$(basename "$file")"
            while IFS= read -r asset_id; do
              [[ -n "$asset_id" ]] && curl -kfsS "${auth[@]}" -X DELETE "$api/releases/$id/assets/$asset_id" >/dev/null
            done < <(jq -r --arg n "$name" '.assets[]? | select(.name==$n) | .id' /tmp/release.json)
            echo "Publishing $name"
            curl -kfsS "${auth[@]}" -X POST -F "attachment=@$file" "$api/releases/$id/assets?name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")" >/dev/null
            curl -kfsS "${auth[@]}" "$api/releases/$id" > /tmp/release.json
          done

          echo "Published release: $tag"
