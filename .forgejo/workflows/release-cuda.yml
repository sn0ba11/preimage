name: Release CUDA binary

on:
  push:
    tags:
      - "v*-cuda*"
  workflow_dispatch:

jobs:
  linux-cuda:
    runs-on: docker
    timeout-minutes: 60

    steps:
      - name: Check out Preimage from local Forgejo
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "http://forgejo-actions:${FORGEJO_TOKEN}@192.168.224.2:3000/${FORGEJO_REPOSITORY}.git"
          git fetch --depth 1 origin "${FORGEJO_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Build CUDA release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-cuda target-forgejo-cuda
          docker run --rm \
            --volumes-from forgejo-runner \
            -e PREIMAGE_REQUIRE_CUDA=1 \
            -e CARGO_TARGET_DIR="$PWD/target-forgejo-cuda" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -w "$PWD" \
            nvidia/cuda:13.0.1-devel-ubuntu24.04 \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential ca-certificates curl
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH=/root/.cargo/bin:/usr/local/cuda/bin:$PATH
              nvcc --version
              cargo build --release -p preimage
              ldd target-forgejo-cuda/release/preimage | grep "libcudart.so.13"
              mkdir -p dist-cuda/package
              cp target-forgejo-cuda/release/preimage README.md LICENSE-APACHE LICENSE-MIT dist-cuda/package/
              tar -C dist-cuda/package -czf dist-cuda/preimage-linux-x86_64-cuda13.tar.gz \
                preimage README.md LICENSE-APACHE LICENSE-MIT
              sha256sum dist-cuda/preimage-linux-x86_64-cuda13.tar.gz \
                > dist-cuda/preimage-linux-x86_64-cuda13.tar.gz.sha256
              chown -R "$HOST_UID:$HOST_GID" target-forgejo-cuda dist-cuda
            '

      - name: Publish Forgejo release
        if: startsWith(forgejo.ref, 'refs/tags/')
        env:
          HOST_CURL: /usr/bin/curl
          HOST_PYTHON: /usr/bin/python3
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: token $FORGEJO_TOKEN"
          release_url="http://192.168.224.2:3000/api/v1/repos/$FORGEJO_REPOSITORY/releases"
          release_json="$("$HOST_CURL" -fsS -H "$auth" "$release_url/tags/$FORGEJO_REF_NAME" 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            release_json="$("$HOST_CURL" -fsS -H "$auth" -H 'Content-Type: application/json' -X POST \
              -d "{\"tag_name\":\"$FORGEJO_REF_NAME\",\"target_commitish\":\"$FORGEJO_SHA\",\"name\":\"Preimage $FORGEJO_REF_NAME\",\"body\":\"CUDA 13 Linux x86-64 build with CloudAP / Microsoft Online mode 33700 acceleration.\",\"draft\":false,\"prerelease\":false}" \
              "$release_url")"
          fi
          release_id="$(printf '%s' "$release_json" | "$HOST_PYTHON" -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          for asset in dist-cuda/preimage-linux-x86_64-cuda13.tar.gz dist-cuda/preimage-linux-x86_64-cuda13.tar.gz.sha256; do
            name="$(basename "$asset")"
            "$HOST_CURL" -fsS -H "$auth" -X POST -F "attachment=@$asset" \
              "$release_url/$release_id/assets?name=$name" >/dev/null
          done
