name: Release CUDA binary

on:
  push:
    tags:
      - "v*-cuda*"
  workflow_dispatch:

jobs:
  linux-cuda:
    runs-on: docker
    timeout-minutes: 60

    steps:
      - name: Check out Preimage from local Forgejo
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "http://forgejo-actions:${FORGEJO_TOKEN}@192.168.224.2:3000/${FORGEJO_REPOSITORY}.git"
          git fetch --depth 1 origin "${FORGEJO_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Build CUDA release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-cuda target-forgejo-cuda
          docker run --rm \
            --volumes-from forgejo-runner \
            -e PREIMAGE_REQUIRE_CUDA=1 \
            -e CARGO_TARGET_DIR="$PWD/target-forgejo-cuda" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -w "$PWD" \
            nvidia/cuda:13.0.1-devel-ubuntu24.04 \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential ca-certificates curl
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH=/root/.cargo/bin:/usr/local/cuda/bin:$PATH
              nvcc --version
              cargo build --release -p preimage
              ldd target-forgejo-cuda/release/preimage | grep "libcudart.so.13"
              mkdir -p dist-cuda/package
              cp target-forgejo-cuda/release/preimage README.md LICENSE-APACHE LICENSE-MIT dist-cuda/package/
              tar -C dist-cuda/package -czf dist-cuda/preimage-linux-x86_64-cuda13.tar.gz \
                preimage README.md LICENSE-APACHE LICENSE-MIT
              sha256sum dist-cuda/preimage-linux-x86_64-cuda13.tar.gz \
                > dist-cuda/preimage-linux-x86_64-cuda13.tar.gz.sha256
              chown -R "$HOST_UID:$HOST_GID" target-forgejo-cuda dist-cuda
            '

      - name: Publish Forgejo release
        if: startsWith(forgejo.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(wget -qO- --header="Authorization: token $FORGEJO_TOKEN" \
            "http://192.168.224.2:3000/api/v1/repos/$FORGEJO_REPOSITORY/releases/tags/$FORGEJO_REF_NAME")"
          release_id="$(printf '%s' "$release_json" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)"
          test -n "$release_id"
          docker cp dist-cuda/preimage-linux-x86_64-cuda13.tar.gz forgejo:/tmp/preimage-linux-x86_64-cuda13.tar.gz
          docker cp dist-cuda/preimage-linux-x86_64-cuda13.tar.gz.sha256 forgejo:/tmp/preimage-linux-x86_64-cuda13.tar.gz.sha256
          for asset in preimage-linux-x86_64-cuda13.tar.gz preimage-linux-x86_64-cuda13.tar.gz.sha256; do
            docker exec -e FORGEJO_TOKEN="$FORGEJO_TOKEN" forgejo /usr/bin/curl -fsS \
              -H "Authorization: token $FORGEJO_TOKEN" -X POST -F "attachment=@/tmp/$asset" \
              "http://127.0.0.1:3000/api/v1/repos/$FORGEJO_REPOSITORY/releases/$release_id/assets?name=$asset" >/dev/null
            docker exec forgejo rm -f "/tmp/$asset"
          done
